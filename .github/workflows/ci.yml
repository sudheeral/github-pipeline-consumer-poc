# Consumer pipeline — calls the PDP framework's reusable app workflow.

name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "hotfix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner to use"
        type: choice
        default: "self-hosted"
        options:
          - self-hosted
          - ubuntu-latest

jobs:
  ci:
    name: CI
    uses: sudheeral/github-pipeline-poc/.github/workflows/app.yml@main
    with:
      deployment_type: ecs
      runs_on: ${{ inputs.runner || 'self-hosted' }}
    secrets: inherit
